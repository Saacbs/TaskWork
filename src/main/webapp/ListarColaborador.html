
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listar Colaboradores</title>
</head>
<body>

<h1>Colaboradores dentro do TaskWork</h1>

<table>
    <thead>
    <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Empresa</th>
    </tr>
    </thead>
    <tbody id="lista-colaboradores">
    </tbody>
</table>

<script>
    fetch('listar-colaborador')
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error('Erro ao buscar colaboradores: ' + resposta.status);
            }
            return resposta.json();
        })
        .then(colaboradores => {
            const tbody = document.getElementById('lista-colaboradores');

            colaboradores.forEach(colaborador => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                        <td>${colaborador.nome ?? ''}</td>
                        <td>${colaborador.email ?? ''}</td>
                        <td>${colaborador.telefone ?? ''}</td>
                        <td>${colaborador.nomeEmpresa ?? ''}</td>
                    `;

                tbody.appendChild(tr);
            });
        })
        .catch(erro => {
            console.error('Erro ao carregar colaboradores:', erro);
        });
</script>

</body>
</html>
